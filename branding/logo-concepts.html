<!doctype html><html dir="rtl"><head><meta charset="utf-8"><style>
@font-face{font-family:E;src:url(elliniaclm-bold-webfont.woff);font-weight:700}
@font-face{font-family:E;src:url(elliniaclm-light-webfont.woff);font-weight:300}
body{margin:0;background:#f7f4ee;font-family:E;color:#141c33}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:28px;padding:36px}
.card{background:#fff;border:1px solid #e6dcc6;border-radius:22px;padding:28px 20px 22px;text-align:center}
.card h3{margin:14px 0 0;font-weight:300;font-size:22px;color:#8a6a26}
.dark{background:#141c33;border-color:#141c33}
svg{display:block;margin:0 auto}
</style></head><body><div class="grid">
<!-- A: gift box + wordmark -->
<div class="card"><svg width="300" height="230" viewBox="0 0 300 230">
 <g fill="none" stroke="#b8964a" stroke-width="3" stroke-linejoin="round" stroke-linecap="round">
  <rect x="110" y="58" width="80" height="58" rx="4"/><rect x="104" y="44" width="92" height="16" rx="3"/>
  <line x1="150" y1="44" x2="150" y2="116"/>
  <path d="M150 44 C134 22 112 28 122 40 C128 46 142 45 150 44 Z"/><path d="M150 44 C166 22 188 28 178 40 C172 46 158 45 150 44 Z"/>
 </g>
 <text x="150" y="182" text-anchor="middle" font-family="E" font-weight="700" font-size="54" fill="#141c33">מתנות</text>
 <text x="150" y="212" text-anchor="middle" font-family="E" font-weight="300" font-size="17" fill="#8a6a26" letter-spacing="1">מתנה עם מכתב אישי</text>
</svg><h3>א · קופסה ופפיון</h3></div>
<!-- B: monogram -->
<div class="card"><svg width="300" height="230" viewBox="0 0 300 230">
 <circle cx="150" cy="92" r="66" fill="#141c33"/><circle cx="150" cy="92" r="58" fill="none" stroke="#c9a85a" stroke-width="2"/>
 <circle cx="150" cy="92" r="52" fill="none" stroke="#c9a85a" stroke-width=".8" opacity=".7"/>
 <text x="150" y="118" text-anchor="middle" font-family="E" font-weight="700" font-size="76" fill="#e3c77d">מ</text>
 <path d="M126 32 q24 -14 48 0" fill="none" stroke="#e3c77d" stroke-width="2.5" stroke-linecap="round"/>
 <text x="150" y="200" text-anchor="middle" font-family="E" font-weight="700" font-size="40" fill="#141c33" letter-spacing="2">מתנות</text>
</svg><h3>ב · מונוגרמה בעיגול</h3></div>
<!-- C: envelope with seal -->
<div class="card"><svg width="300" height="230" viewBox="0 0 300 230">
 <rect x="96" y="40" width="108" height="72" rx="6" fill="#fbf8f1" stroke="#141c33" stroke-width="2.5"/>
 <path d="M96 46 L150 86 L204 46" fill="none" stroke="#141c33" stroke-width="2.5" stroke-linejoin="round"/>
 <circle cx="150" cy="86" r="15" fill="#b8964a"/><circle cx="150" cy="86" r="10" fill="none" stroke="#f3e2b0" stroke-width="1.5"/>
 <path d="M150 92 l-5 -5 a3.2 3.2 0 0 1 5 -4 a3.2 3.2 0 0 1 5 4 z" fill="#f3e2b0"/>
 <text x="150" y="176" text-anchor="middle" font-family="E" font-weight="700" font-size="54" fill="#141c33">מתנות</text>
 <line x1="96" y1="192" x2="204" y2="192" stroke="#b8964a" stroke-width="1.5"/>
 <text x="150" y="215" text-anchor="middle" font-family="E" font-weight="300" font-size="16" fill="#8a6a26">רחוקים בעין, קרובים בלב</text>
</svg><h3>ג · מעטפה וחותם</h3></div>
</div>
<div class="grid" style="padding-top:0">
<div class="card dark"><svg width="300" height="150" viewBox="0 30 300 150"><g fill="none" stroke="#e3c77d" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"><rect x="110" y="58" width="80" height="58" rx="4"/><rect x="104" y="44" width="92" height="16" rx="3"/><line x1="150" y1="44" x2="150" y2="116"/><path d="M150 44 C134 22 112 28 122 40 C128 46 142 45 150 44 Z"/><path d="M150 44 C166 22 188 28 178 40 C172 46 158 45 150 44 Z"/></g><text x="150" y="172" text-anchor="middle" font-family="E" font-weight="700" font-size="44" fill="#f7f4ee">מתנות</text></svg><h3 style="color:#e3c77d">א על רקע כהה</h3></div>
<div class="card dark"><svg width="300" height="150" viewBox="0 20 300 150"><circle cx="150" cy="92" r="58" fill="none" stroke="#e3c77d" stroke-width="2"/><text x="150" y="118" text-anchor="middle" font-family="E" font-weight="700" font-size="76" fill="#e3c77d">מ</text><path d="M126 38 q24 -14 48 0" fill="none" stroke="#e3c77d" stroke-width="2.5" stroke-linecap="round"/></svg><h3 style="color:#e3c77d">ב כאייקון קטן</h3></div>
<div class="card dark"><svg width="300" height="150" viewBox="0 30 300 150"><rect x="96" y="40" width="108" height="72" rx="6" fill="none" stroke="#f7f4ee" stroke-width="2.5"/><path d="M96 46 L150 86 L204 46" fill="none" stroke="#f7f4ee" stroke-width="2.5"/><circle cx="150" cy="86" r="15" fill="#c9a85a"/><path d="M150 92 l-5 -5 a3.2 3.2 0 0 1 5 -4 a3.2 3.2 0 0 1 5 4 z" fill="#141c33"/><text x="150" y="168" text-anchor="middle" font-family="E" font-weight="700" font-size="44" fill="#f7f4ee">מתנות</text></svg><h3 style="color:#e3c77d">ג על רקע כהה</h3></div>
</div></body></html>
